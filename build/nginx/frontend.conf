server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://recorder.incident-lens.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep browser OTLP traffic same-origin to avoid exposing Jaeger to the
    # browser or configuring cross-origin requests. Jaeger accepts OTLP/HTTP
    # at /v1/traces; strip the /otlp prefix used by the frontend.
    location /otlp/ {
        proxy_pass http://jaeger.incident-lens-observability.svc.cluster.local:4318/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
