apiVersion: apps/v1
kind: Deployment
metadata:
  name: recorder
  namespace: incident-lens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recorder
  template:
    metadata:
      labels:
        app: recorder
    spec:
      containers:
        - name: recorder
          image: incident-lens/recorder:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: WATCH_NAMESPACE
              value: incident-lens
            - name: DATABASE_PATH
              value: /data/observations.db
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://jaeger.incident-lens-observability.svc.cluster.local:4318/v1/traces
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: recorder-data
              mountPath: /data
      serviceAccountName: incident-lens-recorder
      volumes:
        - name: recorder-data
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-lens-recorder
  namespace: incident-lens
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-lens-recorder
  namespace: incident-lens
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-lens-recorder
  namespace: incident-lens
subjects:
  - kind: ServiceAccount
    name: incident-lens-recorder
    namespace: incident-lens
roleRef:
  kind: Role
  name: incident-lens-recorder
  apiGroup: rbac.authorization.k8s.io
